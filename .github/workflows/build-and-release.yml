name: Build and Release Multiplatform

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-web-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-web-

      - name: Install Dioxus CLI
        run: |
          if ! command -v dx >/dev/null 2>&1; then
            cargo install dioxus-cli --version 0.7.10 --locked
          fi

      - name: Build Web Application
        run: |
          dx build --platform web --release --base-path /golpobela/

      - name: Package Web Build
        run: |
          mkdir -p dist-web
          cp -r target/dx/golpo/release/web/public/* dist-web/
          cd dist-web && zip -r ../golpobela-web.zip . && cd ..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: golpobela-web
          path: golpobela-web.zip

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-web

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: golpobela-desktop-linux
            binary_path: target/release/golpo
            out_name: golpobela-linux-x86_64
          - os: windows-latest
            artifact_name: golpobela-desktop-windows
            binary_path: target/release/golpo.exe
            out_name: golpobela-windows-x86_64.exe
          - os: macos-latest
            artifact_name: golpobela-desktop-macos
            binary_path: target/release/golpo
            out_name: golpobela-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Build Desktop Binary
        run: |
          cargo build --release --no-default-features --features desktop

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist-desktop
          cp "${{ matrix.binary_path }}" "dist-desktop/${{ matrix.out_name }}"

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-desktop/${{ matrix.out_name }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android NDK and SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install Dioxus CLI
        run: |
          if ! command -v dx >/dev/null 2>&1; then
            cargo install dioxus-cli --version 0.7.10 --locked
          fi

      - name: Bundle Android Project
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          export NDK_HOME="$ANDROID_NDK_HOME"
          dx bundle --android --release --target aarch64-linux-android --package-types apk || true

      - name: Build APK with Gradle
        run: |
          ANDROID_APP_DIR="target/dx/golpo/release/android/app"
          if [ -d "$ANDROID_APP_DIR" ]; then
            cd "$ANDROID_APP_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug || ./gradlew assembleRelease
          fi

      - name: Find and Collect APK
        run: |
          mkdir -p dist-apk
          find target/ -name "*.apk" -exec cp {} dist-apk/GolpoBela-android.apk \; || true
          ls -la dist-apk/ || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('dist-apk/*.apk') != ''
        with:
          name: golpobela-android-apk
          path: dist-apk/*.apk

  release:
    name: Create GitHub Release
    needs: [build-web, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Organize Release Files
        run: |
          mkdir -p release-files
          find release-assets/ -type f -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
